
package:
  name: spec
  publish:
    license: MIT
    version: 8.1.2
    location:
      githubOwner: purescript-spec
      githubRepo: purescript-spec
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - ansi: ">=7.0.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - avar: ">=5.0.0 <6.0.0"
    - bifunctors: ">=6.0.0 <7.0.0"
    - control: ">=6.0.0 <7.0.0"
    - datetime: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - fork: ">=6.0.0 <7.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - now: ">=6.0.0 <7.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - parallel: ">=7.0.0 <8.0.0"
    - pipes: ">=8.0.0 <9.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tailrec: ">=6.1.0 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - debug
  test:
    main: Test.Main
    dependencies:
      - console
      - node-buffer
      - node-child-process
      - node-event-emitter
      - node-fs
      - node-os
      - node-process
      - node-streams
      - refs
      - spec-node

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output, --threaded]
  packageSet:
    registry: 77.7.0
  extraPackages:
    node-os:
      path: "../purust-node-os"
    node-child-process:
      path: "../purust-node-child-process"
    node-event-emitter:
      path: "../purust-node-event-emitter"
