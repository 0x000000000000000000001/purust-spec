      path: "../purust-arrays"
    assert:
      path: "../purust-assert"
    avar:
      path: "../purust-avar"
    catenable-lists:
      path: "../purust-catenable-lists"
    console:
      path: "../purust-console"
    datetime:
      path: "../purust-datetime"
    effect:
      path: "../purust-effect"
    enums:
      path: "../purust-enums"
